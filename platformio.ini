[platformio]
description = MAX17055 Battery Gauge Library - Production Grade
default_envs = test

# Configuration for unit testing
[env:test]
platform = native
test_framework = unity
build_flags = 
    -Wall
    -Wextra
    -O2
    -std=c++11
    -DPLATFORMIO_TEST
    -fprofile-arcs
    -ftest-coverage
    -g
lib_deps = 
    
# AVR Development Environment - For compilation testing
[env:avr-atmega328p]
platform = atmelavr
board = uno
framework = arduino
build_flags = 
    -Wall
    -Wextra
    -O2
lib_deps =
    I2C_Functions
    
# ARM Development Environment - For compilation testing
[env:arm-stm32]
platform = ststm32
board = bluepill_f103c8
framework = mbed
build_flags = 
    -Wall
    -Wextra
    -O2
lib_deps =
    I2C_Functions

# Performance Analysis Environment
[env:profile]
platform = native
build_flags =
    -Wall
    -Wextra
    -O3
    -march=native
    -fprofile-arcs
    -ftest-coverage
    -g
lib_deps =

# Memory Analysis Environment
[env:memory]
platform = native
build_flags =
    -Wall
    -Wextra
    -O0
    -g
    -DMEMORY_ANALYSIS
lib_deps =
